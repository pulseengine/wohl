artifacts:
  - id: SWREQ-TEMP-003
    type: sw-req
    title: "TEMP-P03: Rapid temperature drop detection"
    status: approved
    release: "v0.8.0"
    description: >
      The TemperatureMonitor shall track temperature change per zone over
      a sliding 10-minute window. When the temperature drops by more than
      200 (2.00 C, strict comparison) within the window, the monitor
      shall emit a rapid-cooling alert. The window is evaluated at
      60-second bucket granularity: every drop that completes within 600
      seconds is detected, and a drop may additionally be detected up to
      60 seconds beyond the window. This detects conditions like a broken
      window in winter or HVAC failure, including gradual onsets that no
      single pair of consecutive readings reveals.
    tags: [temperature, rate-detection, kani]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Split by dimension, because symbolic u64 time division is
        intractable for CBMC (each narrowing is a documented trust
        escape in the harness comments). Values: Kani BMC harnesses
        prove for every value pair in +-100.00 C that a drop strictly
        above the threshold at the farthest in-window alignment fires
        and that no drop fires at the nearest expired alignment; the
        no-panic and alert-bound harnesses run symbolic values through
        all four window code paths at concrete times. Time: exhaustive
        tests check all 60 bucket alignments crossed with every
        in-window dt (fires at drop 201, silent at 200) and every
        expired dt up to 2000 s (silent at drop 3000), 117,120 pairs; a
        proptest adds random large-epoch alignments. Unit tests pin the
        gradual 2.01 C / 9 min onset firing and 1.99 C staying silent.
    links:
      - type: derives-from
        target: SYSREQ-WOHL-002
