artifacts:
  - id: SWREQ-LEAK-003
    type: sw-req
    title: "LEAK-P03: Zone state is bounded and never overflows"
    status: approved
    description: >
      The LeakDetector shall track per-zone leak state using a fixed-size
      data structure (maximum 32 zones). Registration of a 33rd zone is
      refused. A water-event for an unregistered zone reports Unknown and
      leaves all tracked state unchanged — it never panics, overflows or
      evicts a tracked zone; the hub shall still raise an alert for a
      wet == true event on an unregistered zone, from the event itself
      rather than from zone state.
    tags: [water-leak, bounded, no-alloc, verus]
    fields:
      req-type: safety
      priority: must
      verification-criteria: >
        Kani BMC harness: zone count never exceeds 32; no arithmetic
        overflow. Unit tests: 33rd registration refused; event for an
        unregistered zone returns Unknown with state unchanged.
        Integration: wet == true on an unregistered zone still raises
        an alert at the hub.
    links:
      - type: derives-from
        target: SYSREQ-WOHL-001
      - type: derives-from
        target: SYSREQ-WOHL-008
