artifacts:
  - id: SWREQ-TEMP-001
    type: sw-req
    title: "TEMP-P01: Freeze alert when temperature below threshold"
    status: approved
    description: >
      When a temperature reading has value at or below the freeze
      threshold (value <= 300 at the 3.00 C fixed-point default — exactly
      300 alerts, 301 does not), the TemperatureMonitor shall emit a
      critical freeze alert for that zone. The threshold is configurable
      per zone at registration and defaults to 300.
    tags: [temperature, freeze, safety, verus]
    fields:
      req-type: safety
      priority: must
      verification-criteria: >
        Kani BMC harness: for all inputs where value <= freeze_threshold,
        output contains the freeze alert. Boundary tests at 299 (alert),
        300 (alert), 301 (no alert) in wohl-integration.
    links:
      - type: derives-from
        target: SYSREQ-WOHL-002
