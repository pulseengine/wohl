artifacts:
  - id: SWREQ-TEMP-002
    type: sw-req
    title: "TEMP-P02: Overheat alert when temperature above threshold"
    status: approved
    description: >
      When a temperature reading has value at or above the overheat
      threshold (value >= 4000 default, i.e. 40.00 C — exactly 4000
      alerts), the TemperatureMonitor shall emit an overheat alert.
      The monitor has one overheat threshold per zone; severity grading
      above it (warning vs critical bands) is the dispatcher's mapping,
      not a second engine threshold. The threshold is configurable per
      zone at registration.
    tags: [temperature, overheat, safety, verus]
    fields:
      req-type: safety
      priority: must
      verification-criteria: >
        Kani BMC harness: for all inputs where value >= overheat
        threshold, output contains the overheat alert. Boundary tests at
        3999 (no alert), 4000 (alert), 4001 (alert) in wohl-integration.
    links:
      - type: derives-from
        target: SYSREQ-WOHL-002
