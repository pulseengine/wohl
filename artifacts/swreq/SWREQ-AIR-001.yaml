artifacts:
  - id: SWREQ-AIR-001
    type: sw-req
    title: "AIR-P01: CO2 threshold alerting"
    status: approved
    description: >
      The AirMonitor shall evaluate CO2 readings from air-quality events.
      At or above 1000 ppm it shall emit a warning alert; at or above
      2000 ppm it shall emit a critical alert. Thresholds are
      configurable per zone at registration. A reading at or above the
      critical threshold emits both the warning and the critical alert;
      downstream deduplication collapses repeats, and the dual emission
      ensures the critical alert can never be masked.
    tags: [air-quality, co2, health, verus]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Kani BMC harness: every CO2 reading at or above a threshold
        produces that threshold's alert and none below it. Boundary tests
        at 999/1000/1001 and 1999/2000/2001 in wohl-integration
        (requirement_boundary_pins).
    links:
      - type: derives-from
        target: SYSREQ-WOHL-003
