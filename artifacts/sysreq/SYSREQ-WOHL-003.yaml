artifacts:
  - id: SYSREQ-WOHL-003
    type: system-req
    title: Air quality monitoring
    status: approved
    description: >
      The system shall monitor air quality metrics (CO2, PM2.5, VOC index)
      from air-quality sensors and generate alerts when any metric reaches
      its configured threshold (comparison is at-or-above). The following
      are the configurable defaults: CO2 1000 ppm warning, 2000 ppm
      critical; PM2.5 35 ug/m3 warning, 150 ug/m3 critical (carried on the
      wire as 10x the ug/m3 value); VOC index 250 warning,
      400 critical.
    tags: [air-quality, health, monitoring]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Unit tests for each metric threshold at boundary values.
        Formal verification (Kani BMC) proves an alert is raised for
        every reading at or above a threshold, per reading. Multi-metric
        combination tests.
    links:
      - type: derives-from
        target: STKH-WOHL-001
      - type: satisfies
        target: SC-WOHL-001
