artifacts:
  - id: SYSREQ-WOHL-004
    type: system-req
    title: Door and window supervision
    status: approved
    description: >
      The system shall monitor door and window contact sensors and generate
      alerts when a door or window is left open beyond a configurable timeout
      (default 10 minutes). During the configurable night window (default
      22:00-06:00), opening a door or window shall generate an immediate
      alert. The system shall track per-contact open/close state.
    tags: [door-watch, security, monitoring]
    fields:
      req-type: functional
      priority: must
      verification-criteria: >
        Unit tests for timeout expiry and the immediate night-open alert.
        Kani BMC proves an alert is raised after the timeout for every
        open contact event. Integration test with time-advancing
        streams.
    links:
      - type: derives-from
        target: STKH-WOHL-001
      - type: satisfies
        target: SC-WOHL-001
