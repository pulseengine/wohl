name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned sibling-repo commits — bumped explicitly via PR. Without these
  # pins, unpinned `main` of relay/rivet can change tool behavior on this
  # workflow with zero wohl code change (see #8 for the concrete
  # incident that motivated pinning). These values are copies of
  # tools/deps/sibling-pins.env (the canonical pin source); the Script
  # portability job fails if any copy diverges. Bump there first.
  #
  # IMPORTANT: every cross-repo checkout below uses `fetch-depth: 0`
  # because relay/rivet are routinely force-pushed by the architect.
  # Without a full fetch, an orphaned (rebased-away) SHA fails to
  # resolve under actions/checkout's default shallow strategy.
  RELAY_REF: 178ffd479ad863c91ece4f580379a9207c36a530
  RIVET_REF: 78f001e23d595ba816f7a7be59282194dedfdc12
  # Pinned rules_wasm_component for Bazel-running jobs (verus, future
  # bazel build //...). wohl's MODULE.bazel uses local_path_override
  # for local dev; CI checks out the pinned ref into a sibling path so
  # the override resolves.
  RULES_WASM_COMPONENT_REF: fbe20571eee9bd05687c95e7a43f6c236d9b2428
  # Pinned meld + witness for the advisory composed-attribution steps in
  # the bazel-build job (wohl#58). Copies of tools/deps/sibling-pins.env.
  MELD_REF: v0.68.0
  WITNESS_REF: v0.46.0
  # Pinned sigil release for the build-stage attestation gate (sigil-attest
  # job signs the composed Matter component). sigil ships its binary as
  # `wsc`; installed from the cosign-verified release, in lock-step with
  # release.yml's WSC_VERSION — bump together via PR.
  WSC_VERSION: v0.12.2

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: wohl
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pulseengine/relay
          path: relay
          ref: ${{ env.RELAY_REF }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.87.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: wohl
      - name: cargo fmt --check (per workspace member)
        working-directory: wohl
        # `cargo fmt --all` reaches into local path-dependencies and would
        # fail on unrelated drift in sibling repos (relay/, rivet/). Run
        # per-package so the gate stays scoped to this workspace's members.
        run: |
          for c in wohl-leak wohl-temp wohl-air wohl-door wohl-power wohl-alert wohl-hub wohl-integration; do
            echo "::group::cargo fmt -p $c"
            cargo fmt -p "$c" --check
            echo "::endgroup::"
          done
      - name: cargo clippy
        working-directory: wohl
        run: cargo clippy --workspace --all-targets -- -D warnings

  cargo-deny:
    # Supply-chain gate: bans, licenses, advisories, sources.
    # Configuration lives in deny.toml at the repo root. Duplicate-
    # versions and unmaintained advisories currently warn rather than
    # fail (see deny.toml comment and #8 follow-ups).
    name: cargo-deny (supply-chain)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: wohl
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pulseengine/relay
          path: relay
          ref: ${{ env.RELAY_REF }}
          fetch-depth: 0
      # cargo-deny-action handles install + cache + invocation. v2 is
      # the current stable major (matches the action's tag scheme).
      # If we want SHA-pinning parity with the rest of this workflow,
      # bump to a sha256 in a follow-up — for now @v2 keeps us on
      # security patches in the v2 major automatically.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: wohl/Cargo.toml
          command: check bans licenses advisories sources

      # ── Nested lockfiles (lockfile sweep, 2026-11-20) ──────────────
      # The check above covers only the workspace Cargo.lock. Six more
      # committed locks exist (fuzz + five standalone spike/wasm
      # crates); each gets its own advisories check. cargo-deny
      # resolves deny.toml upward from the manifest, so every nested
      # check runs under the same root policy and ignore list.
      - name: "Nested lock audit: fuzz"
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: wohl/fuzz/Cargo.toml
          command: check advisories
      - name: "Nested lock audit: wohl-leak/wasm"
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: wohl/crates/wohl-leak/wasm/Cargo.toml
          command: check advisories
      - name: "Nested lock audit: matter-core witness"
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: wohl/crates/wohl-matter-core/witness/Cargo.toml
          command: check advisories
      - name: "Nested lock audit: spike2-exec"
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: wohl/crates/wohl-matter-core/spike2-exec/Cargo.toml
          command: check advisories
      - name: "Nested lock audit: spike2c transport"
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: wohl/crates/wohl-matter-core/spike2c-compose/transport/Cargo.toml
          command: check advisories
      - name: "Nested lock audit: spike2c mcore"
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: wohl/crates/wohl-matter-core/spike2c-compose/mcore/Cargo.toml
          command: check advisories

      # Freshness: the five standalone locks must match their
      # manifests. fuzz and the root workspace are excluded here: both
      # carry sibling relay path-deps and build unlocked by design
      # (wohl#30; fuzz-smoke comment below). Their locks are committed
      # audit records, not build pins.
      - name: Nested locks are fresh (cargo metadata --locked)
        working-directory: wohl
        run: |
          set -euo pipefail
          for m in crates/wohl-leak/wasm crates/wohl-matter-core/witness \
                   crates/wohl-matter-core/spike2-exec \
                   crates/wohl-matter-core/spike2c-compose/transport \
                   crates/wohl-matter-core/spike2c-compose/mcore; do
            echo "== $m"
            cargo metadata --locked --format-version 1 \
              --manifest-path "$m/Cargo.toml" > /dev/null
          done

      # Red control: a stale lock must turn this job red. The fixture's
      # manifest requires a bitflags version its Cargo.lock does not
      # pin; --locked must refuse it. If it does not, the freshness
      # guard above is vacuous.
      - name: "Control: stale lock fails --locked"
        working-directory: wohl
        run: |
          set -euo pipefail
          if cargo metadata --locked --format-version 1 \
               --manifest-path tools/lockfile-controls/stale-lock/Cargo.toml \
               > /dev/null 2>&1; then
            echo "::error::stale-lock control passed a --locked metadata read; the freshness guard does not detect stale locks"
            exit 1
          fi
          echo "stale-lock control refused as expected"

      # Red control: an advisory in a nested lock must turn the audit
      # red. The fixture pins smallvec 1.6.0 (RUSTSEC-2021-0003); the
      # check must fail and the follow-up step asserts it did.
      - name: "Control: planted advisory in a nested lock"
        id: advisory_control
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: wohl/tools/lockfile-controls/advisory-fixture/Cargo.toml
          command: check advisories
      - name: "Control: assert the planted advisory went red"
        if: steps.advisory_control.outcome != 'failure'
        run: |
          echo "::error::advisory-fixture control did not fail (outcome ${{ steps.advisory_control.outcome }}); the nested audit cannot detect a planted RUSTSEC"
          exit 1

  test:
    name: cargo test (workspace, incl. proptest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: wohl
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pulseengine/relay
          path: relay
          ref: ${{ env.RELAY_REF }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.87.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: wohl
      - name: cargo test
        working-directory: wohl
        # NOT --locked (wohl#30): wohl has path-deps to the sibling `relay` repo,
        # which CI checks out at a pinned RELAY_REF that is routinely rebased
        # independently of wohl's Cargo.lock. `--locked` then fails with "lock
        # needs updating" because the committed lock was resolved against a
        # different relay commit. The drift surfacing below is the viable guard;
        # true lock-pinning would require pinning relay's commit INTO the lock,
        # which the moving-sibling design precludes.
        run: cargo test --workspace --all-features
      - name: Lockfile drift surfacing (informational)
        working-directory: wohl
        # The --locked tests above PIN the surface; this surfaces WHEN that
        # pinned surface has newer compatible versions available upstream, so
        # drift is visible on the PR instead of silent. Non-gating. wohl#30.
        run: |
          echo "Dependencies with newer compatible versions available:"
          cargo update --dry-run --workspace 2>&1 | grep -iE 'updating|latest' || echo "  (lockfile is current with the registry)"

  kani:
    # Matrix split (was a single serial bash loop): each component gets
    # its own job so a Kani failure names the offending crate in the
    # GitHub UI without log-diving, and the 7 proofs run in parallel.
    # Crates are hardcoded — dynamic discovery would mean parsing
    # Cargo.toml at job-graph time, which GH Actions can't do cleanly.
    # When a new Kani-verified crate lands, add it here.
    name: "Kani: ${{ matrix.crate }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        crate:
          - wohl-leak
          - wohl-temp
          - wohl-air
          - wohl-door
          - wohl-power
          - wohl-alert
          - wohl-ota
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: wohl
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pulseengine/relay
          path: relay
          ref: ${{ env.RELAY_REF }}
          fetch-depth: 0
      # Kani-verifier (the installer) needs newer Rust than our MSRV.
      # Kani itself uses an internal nightly for the proofs.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: wohl
          key: kani-${{ matrix.crate }}
      - name: Cache Kani install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
          # Shared Kani install cache across matrix cells: the toolchain
          # bits are crate-independent and large (~1 GB), so per-cell
          # caching would waste bandwidth and time. Per-crate target/
          # incremental dirs are covered by Swatinem/rust-cache above.
          key: kani-${{ runner.os }}-v1
      - name: Install Kani
        run: |
          if ! command -v cargo-kani >/dev/null 2>&1; then
            cargo install --locked kani-verifier
          fi
          cargo kani setup
      - name: Run Kani on ${{ matrix.crate }}
        working-directory: wohl
        # NOT --locked — same reason as the cargo test job (moving relay sibling
        # vs the committed Cargo.lock; see that comment). wohl#30.
        run: cargo kani -p "${{ matrix.crate }}"

  fuzz-smoke:
    name: cargo-fuzz smoke (60s/target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: wohl
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pulseengine/relay
          path: relay
          ref: ${{ env.RELAY_REF }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: wohl
          key: fuzz
      - name: Install cargo-fuzz
        # NOT --locked: cargo-fuzz 0.13.1's lockfile pins rustix 0.36.5 which
        # uses unstable rustc_attrs that current nightly no longer accepts.
        # Unlocked resolution picks newer rustix that compiles cleanly.
        run: cargo install cargo-fuzz
      - name: Fuzz fuzz_leak
        working-directory: wohl
        run: cargo fuzz run fuzz_leak -- -max_total_time=60
      - name: Fuzz fuzz_temp
        working-directory: wohl
        run: cargo fuzz run fuzz_temp -- -max_total_time=60

  rivet-validate:
    name: rivet validate (ASPICE artifacts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: wohl
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pulseengine/rivet
          path: rivet
          ref: ${{ env.RIVET_REF }}
          fetch-depth: 0
      # wohl's STPA declares relay as a rivet external (path: ../relay) so the
      # hazard analysis can `traces-to relay:<ID>` the upstream link-layer
      # sec-constraints it inherits (see safety/stpa). The path external
      # resolves live, so relay must sit beside wohl as a sibling checkout;
      # main carries relay's STPA-Sec (PR #117). If relay renames a referenced
      # ID, this job goes red — that is the federation guarantee. For the
      # same reason this checkout is exempt from tools/deps/sibling-pins.env
      # and the job must stay outside any CI path classifier (sieve).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pulseengine/relay
          path: relay
          ref: main
      # rivet-cli's deps need Rust 1.89+; we don't care about MSRV for tooling.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rivet
          key: rivet-cli
      - name: Install rivet-cli
        run: cargo install --locked --path rivet/rivet-cli
      - name: rivet validate
        working-directory: wohl
        run: rivet validate

  verus:
    name: Verus (bazel test //proofs/verus)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: wohl
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pulseengine/rules_wasm_component
          path: rules_wasm_component
          ref: ${{ env.RULES_WASM_COMPONENT_REF }}
          fetch-depth: 0
      # rules_rocq_rust's module extension eagerly creates a
      # nixpkgs-backed rocq_toolchains repo at Bazel analysis time,
      # so every Bazel job needs nix-build on PATH (see MODULE.bazel
      # comment). Pinned to cachix/install-nix-action v31.10.6.
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
      - uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # 0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-verus
          repository-cache: true
      # --lockfile_mode=error: build with the committed MODULE.bazel.lock
      # or go red (lockfile sweep, 2026-11-20). The bazel-build job
      # cannot take this flag yet: its CARGO_BAZEL_REPIN=1 re-resolves
      # the crate universe every run because the committed lock is
      # stale for the grown seed — tracked in the lockfile-sweep issue.
      - name: bazel test //proofs/verus:alert_dedup_verify
        working-directory: wohl
        run: bazel test //proofs/verus:alert_dedup_verify --test_output=summary --lockfile_mode=error

      # Red control: an out-of-date Bazel lock must turn CI red. The
      # lock records MODULE.bazel's hash, so any edit without a lock
      # regeneration must make error-mode refuse. Perturb, expect
      # refusal, restore.
      - name: "Control: perturbed MODULE.bazel fails lockfile_mode=error"
        working-directory: wohl
        run: |
          set -euo pipefail
          echo "# lockfile-control perturbation" >> MODULE.bazel
          if bazel mod deps --lockfile_mode=error > /dev/null 2>&1; then
            echo "::error::MODULE.bazel was perturbed without a lock update and error-mode did not refuse; the Bazel lock is not actually enforced"
            git checkout -- MODULE.bazel
            exit 1
          fi
          git checkout -- MODULE.bazel
          echo "perturbed-lock control refused as expected"

  bazel-build:
    # Catches drift in `rules_wasm_component` and in the
    # `src/wasm_component.rs` files that cargo never sees — each
    # monitor crate's Cargo [lib] points at plain/src/lib.rs, so cargo
    # clippy never type-checks the bindgen glue. `bazel build //:all`
    # exercises every `rust_wasm_component_bindgen` target on the
    # wasm32-wasip2 toolchain, closing that gap (issue #14).
    name: Bazel build (//:all — exercises WASM component glue)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: wohl
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pulseengine/relay
          path: relay
          ref: ${{ env.RELAY_REF }}
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pulseengine/rules_wasm_component
          path: rules_wasm_component
          ref: ${{ env.RULES_WASM_COMPONENT_REF }}
          fetch-depth: 0
      # rules_rocq_rust's module extension eagerly creates a
      # nixpkgs-backed rocq_toolchains repo at Bazel analysis time,
      # so every Bazel job needs nix-build on PATH (see MODULE.bazel
      # comment). Pinned to the same SHA as the verus job above so
      # both stay aligned on cachix/install-nix-action v31.10.6.
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
      - uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # 0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-bazel-build
          repository-cache: true
      - name: bazel build //:all
        working-directory: wohl
        # The committed MODULE.bazel.lock is authoritative (wohl#111):
        # it was regenerated with the grown crate-universe seed on this
        # runner image, CARGO_BAZEL_REPIN is gone, and error-mode
        # refuses any drift. A legitimate universe change (Cargo.lock
        # or manifest edit) regenerates the lock via the one-off
        # artifact-capture flow in PR #113, or on any machine that can
        # run the Bazel toolchain path.
        # TEMP (one round, PR #115): the url 2.5.9 bump changed
        # crates/wohl-leak/wasm/Cargo.lock, which is a crate-extension
        # input recorded in MODULE.bazel.lock, so error-mode correctly
        # refuses the stale lock. This round regenerates it in update
        # mode and uploads it; the next commit restores error-mode.
        run: bazel build //:all --lockfile_mode=update

      - name: Upload regenerated MODULE.bazel.lock (TEMP, one round)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: module-bazel-lock-url259
          path: wohl/MODULE.bazel.lock
          if-no-files-found: error

      # SWARCH-WOHL-008 C4 execution gate: prove the verified Matter core
      # actually RUNS — not just builds — by executing a full SPAKE2+ PASE
      # handshake across the wac_compose'd WIT boundary inside wasmtime. The
      # composed component (//:wohl-matter-composed) exports a bare `run`
      # world func returning true on handshake success; `wasmtime run
      # --invoke 'run()'` reaches it (interface-nested exports are not
      # CLI-invokable, hence the bare shape). Turns the locally-proven
      # spike2c result into a live CI gate.
      - name: Run composed PASE handshake under wasmtime (C4 execution gate)
        working-directory: wohl
        run: |
          set -euo pipefail
          bazel build //:wohl-matter-composed --lockfile_mode=error
          WASM=$(find "$(bazel info bazel-bin)" -name 'wohl-matter-composed.wasm' | head -1)
          test -n "$WASM"
          # Reuse the wasmtime the rules_wasm_component toolchain already
          # fetched (integrity-verified by bazel via MODULE.bazel.lock) — no
          # unpinned curl|bash download of an external install script.
          WT=$(find "$(bazel info output_base)/external" -type f -name wasmtime -path '*wasmtime*' 2>/dev/null | head -1)
          echo "composed=$WASM wasmtime=$WT"
          test -n "$WT"
          OUT=$("$WT" run --invoke 'run()' "$WASM")
          echo "run() => $OUT"
          if [ "$OUT" != "true" ]; then
            echo "::error::PASE handshake did NOT succeed in the composed graph"
            exit 1
          fi
          echo "PASE-RUNS-OK in CI: SPAKE2+ handshake completed across the wac-composed WIT seam"
          # Stage the composed component for the sigil-attest job (bazel-bin
          # is a symlink tree; copy out a real file for upload-artifact).
          cp -L "$WASM" "$GITHUB_WORKSPACE/wohl-matter-composed.wasm"

      - name: Upload composed component for attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wohl-matter-composed
          path: wohl-matter-composed.wasm
          if-no-files-found: error

      # witness v0.47 spike S3 (asked 2026-11-20): a composed build whose
      # DWARF line tables cover wohl's own crates, so witness can attribute
      # decisions to wohl code after meld fusion. The release asset is
      # unchanged; this differs from it only by -Cdebuginfo=1 (line tables).
      # Both release.yml and this step build Bazel's default fastbuild, so
      # the attribution evidence matches the shipped configuration; if the
      # release ever moves to -c opt, move this step with it. Advisory:
      # a failure here must not redden the required Bazel check.
      - name: Build composed component with line tables (witness S3, advisory)
        id: linetables
        working-directory: wohl
        continue-on-error: true
        run: |
          set -euo pipefail
          bazel build //:wohl-matter-composed --lockfile_mode=error \
            --@rules_rust//rust/settings:extra_rustc_flag=-Cdebuginfo=1
          WASM=$(find "$(bazel info bazel-bin)" -name 'wohl-matter-composed.wasm' | head -1)
          test -n "$WASM"
          # The artifact is only useful if wohl paths actually appear in the
          # DWARF strings — assert that here rather than shipping a dud.
          if ! grep -aq 'wohl-matter-core' "$WASM"; then
            echo "::warning::line-tables build contains no wohl source paths; not uploading"
            exit 1
          fi
          cp -L "$WASM" "$GITHUB_WORKSPACE/wohl-matter-composed-linetables.wasm"

      - name: Upload line-tables composed component (witness S3)
        if: steps.linetables.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wohl-matter-composed-linetables
          path: wohl-matter-composed-linetables.wasm

      # wohl#58 first lane (advisory): static decision attribution of the
      # REAL fused composed component, reproducing witness's S3 flow
      # (meld fuse --preserve-names carries the line tables through, so
      # witness instrument sets attribution_source=dwarf by itself). This
      # asserts the fused build keeps attributing decisions to wohl's own
      # sources, and uploads the instrument manifest. Static attribution
      # only — no witness run, no coverage claim (the run step is wohl#58's
      # open half; report scoping is witness#393). The jq prefix filter is
      # interim glue until witness#393's --source-include exists.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.linetables.outcome == 'success'
        with:
          repository: pulseengine/meld
          path: meld
          ref: ${{ env.MELD_REF }}
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.linetables.outcome == 'success'
        with:
          repository: pulseengine/witness
          path: witness
          ref: ${{ env.WITNESS_REF }}
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.linetables.outcome == 'success'
        with:
          workspaces: |
            meld
            witness
          key: meld-witness-s3
      - name: Build meld + witness (pinned)
        id: meldwitness
        if: steps.linetables.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo build --release -p meld-cli --bin meld --manifest-path meld/Cargo.toml
          cargo build --release -p witness-mcdc --bin witness --manifest-path witness/Cargo.toml
      - name: Composed attribution manifest (witness S3, advisory)
        id: attribution
        if: steps.meldwitness.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          MELD="$GITHUB_WORKSPACE/meld/target/release/meld"
          WITNESS="$GITHUB_WORKSPACE/witness/target/release/witness"
          "$MELD" fuse --preserve-names "$GITHUB_WORKSPACE/wohl-matter-composed-linetables.wasm" -o fused.wasm
          "$WITNESS" instrument fused.wasm -o fused.instr.wasm
          MANIFEST=fused.instr.wasm.witness.json
          test -f "$MANIFEST"
          src=$(jq -r '.attribution_source // empty' "$MANIFEST")
          total=$(jq '.decisions|length' "$MANIFEST")
          ours=$(jq -r '.decisions[].source_file' "$MANIFEST" | grep -c '^crates/wohl-matter-core/' || true)
          echo "attribution_source=$src decisions_total=$total wohl-matter-core=$ours"
          # Fail closed: the lane exists to prove attribution reaches our
          # code. Zero attributed decisions, or a non-dwarf source, is the
          # dud this step exists to catch.
          if [ "$src" != "dwarf" ] || [ "$total" -eq 0 ] || [ "$ours" -eq 0 ]; then
            echo "::warning::composed attribution lost: source=$src total=$total ours=$ours"
            exit 1
          fi
          cp "$MANIFEST" "$GITHUB_WORKSPACE/wohl-matter-composed-attribution.json"
      - name: Upload attribution manifest (witness S3)
        if: steps.attribution.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wohl-matter-composed-attribution
          path: wohl-matter-composed-attribution.json
          if-no-files-found: error

  sigil-attest:
    # SWARCH-WOHL-008 step 6: build-stage attestation gate. Signs the
    # bazel-built composed component with sigil and confirms the detached
    # verifier accepts it and rejects tampering — the production form of the
    # locally-demonstrated chain in crates/wohl-matter-core/attestation/.
    # Separate job; depends on bazel-build for the artifact.
    name: sigil attestation (sign composed component)
    runs-on: ubuntu-24.04
    needs: bazel-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: wohl
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wohl-matter-composed
          path: artifact
      - name: Install wsc from the sigil release (cosign-verified)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ubuntu-latest images are dropping preinstalled cosign mid-rollout
          # (observed 2026-11-13: present on one runner, absent on the next).
          COSIGN_VERSION: v3.1.4
          COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
        run: |
          set -euo pipefail
          if ! command -v cosign >/dev/null 2>&1; then
            curl -fsSLo /tmp/cosign \
              "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
            echo "$COSIGN_SHA256  /tmp/cosign" | sha256sum -c -
            chmod +x /tmp/cosign && sudo mv /tmp/cosign /usr/local/bin/cosign
          fi
          cosign version
          mkdir -p "$RUNNER_TEMP/wsc" && cd "$RUNNER_TEMP/wsc"
          gh release download "$WSC_VERSION" --repo pulseengine/sigil \
            -p wsc-linux-x86_64 -p SHA256SUMS.txt -p SHA256SUMS.txt.cosign.bundle
          cosign verify-blob \
            --bundle SHA256SUMS.txt.cosign.bundle \
            --certificate-identity "https://github.com/pulseengine/sigil/.github/workflows/release.yml@refs/tags/$WSC_VERSION" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            SHA256SUMS.txt
          grep 'wsc-linux-x86_64$' SHA256SUMS.txt | sha256sum -c -
          chmod +x wsc-linux-x86_64
          ./wsc-linux-x86_64 --version
      - name: Sign/verify the composed component
        run: |
          set -euo pipefail
          SIGIL="$RUNNER_TEMP/wsc/wsc-linux-x86_64" \
          ARTIFACT="$PWD/artifact/wohl-matter-composed.wasm" \
            wohl/crates/wohl-matter-core/attestation/sign-verify.sh

  matter-interop:
    # THE falsification test: an INDEPENDENT Matter implementation (the
    # official CHIP reference controller, chip-tool) commissions the hub and
    # reads an attribute. The wasmtime gate proves rs-matter agrees with
    # rs-matter; this proves we are spec-compliant against a foreign stack.
    # If chip-tool can't commission/read, we've found a real bug CI never
    # would. NOTE: chip-tool + mDNS in a CI network namespace is fiddly; this
    # job prints diagnostics and is expected to iterate.
    name: Matter interop (chip-tool commissions the hub)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: wohl
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pulseengine/relay
          path: relay
          ref: ${{ env.RELAY_REF }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.87.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: wohl
          key: matter-interop
      - name: Install chip-tool (snap) + mDNS
        run: |
          set -x
          sudo apt-get update && sudo apt-get install -y avahi-daemon avahi-utils libavahi-client3 || true
          sudo systemctl start avahi-daemon || sudo service avahi-daemon start || true
          sudo snap install chip-tool
          chip-tool --version || /snap/bin/chip-tool --version || true
      - name: Build the commissionable device
        working-directory: wohl
        run: cargo build -p wohl-matter-bridge --features rs-matter-backend --example matter-device
      - name: Interop — chip-tool commissions the hub + reads BooleanState
        working-directory: wohl
        run: |
          set -uo pipefail
          CT=$(command -v chip-tool || echo /snap/bin/chip-tool)
          echo "chip-tool: $CT"
          STATE=$(mktemp -d)
          WOHL_MATTER_STATE_DIR="$STATE" ./target/debug/examples/matter-device > device.log 2>&1 &
          DEV=$!
          echo "device pid=$DEV; waiting for it to advertise…"
          sleep 10
          echo "::group::device.log"; cat device.log; echo "::endgroup::"
          if ! kill -0 "$DEV" 2>/dev/null; then echo "::error::device exited early"; exit 1; fi
          echo "::group::commission (pairing onnetwork node=1 pin=20202021)"
          sudo "$CT" pairing onnetwork 1 20202021 --bypass-attestation-verifier true 2>&1 | tee pair.log
          PR=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$PR" -ne 0 ]; then echo "::error::commissioning FAILED (exit $PR)"; echo "---device.log---"; cat device.log; kill "$DEV" 2>/dev/null; exit 1; fi
          echo "::group::read booleanstate state-value node=1 endpoint=1"
          sudo "$CT" booleanstate read state-value 1 1 2>&1 | tee read.log
          RR=${PIPESTATUS[0]}
          echo "::endgroup::"
          kill "$DEV" 2>/dev/null || true
          if [ "$RR" -ne 0 ]; then echo "::error::attribute read FAILED (exit $RR)"; cat device.log; exit 1; fi
          echo "INTEROP-OK: chip-tool commissioned the hub and read BooleanState::StateValue"

  # Committed scripts get run on macOS, where /bin/bash is 3.2 and
  # /usr/bin/python3 is 3.9, while every other job here runs newer tools, so
  # nothing caught a script that only works on the newer ones. Both tools are
  # pinned: shellcheck by sha256 into a job-local path (called as
  # "$SHELLCHECK", never by PATH lookup), Python by setup-python's interpreter
  # path. curl, not `gh`: self-hosted runners do not have the GitHub CLI.
  trust-escape-ledger:
    # SWREQ-REL-003 (objective O3): the set of input-narrowing assumptions in
    # the proof harnesses may only shrink. Growth and a stale baseline both
    # fail, so every change to tools/trust-escape-ledger/baseline.tsv is a
    # reviewed diff. The planted-assume step is the red control: it proves on
    # every run that the check can fail. Marking this job required in the
    # ruleset is the owner's step.
    name: Trust-escape ledger (assumes may only shrink)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: wohl
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pulseengine/relay
          path: relay
          ref: ${{ env.RELAY_REF }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.87.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: wohl
      - name: Ledger check (set-equal against baseline.tsv)
        working-directory: wohl
        run: cargo run -q -p trust-escape-ledger
      - name: Red control (a planted assume must turn the check red)
        working-directory: wohl
        run: |
          set -euo pipefail
          printf 'fn planted() { kani::assume(1 > 0); }\n' > crates/wohl-leak/plain/src/scratch_control.rs
          if cargo run -q -p trust-escape-ledger; then
            echo "::error::red control failed: planted kani::assume did not fail the ledger check"
            exit 1
          fi
          rm crates/wohl-leak/plain/src/scratch_control.rs
          cargo run -q -p trust-escape-ledger

  script-portability:
    name: Script portability (shellcheck + Python 3.9 floor)
    runs-on: ubuntu-24.04  # setup-python has no 3.9 build for 26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # tools/deps/sibling-pins.env is the canonical pin source; the
      # workflow env blocks carry copies (Actions cannot read a repo file
      # at workflow-env level). Any divergence goes red here. Fails closed:
      # a key no workflow uses, or an empty pins file, is also an error.
      - name: Sibling pins match tools/deps/sibling-pins.env
        run: |
          set -euo pipefail
          fail=0
          keys=0
          while IFS='=' read -r key val; do
            case "$key" in ''|'#'*) continue ;; esac
            keys=$((keys + 1))
            found=0
            for f in .github/workflows/*.yml; do
              if grep -Eq "^  ${key}: " "$f"; then
                found=1
                if ! grep -Eq "^  ${key}: ${val}([ ]|\$)" "$f"; then
                  echo "::error file=$f::env copy of $key diverges from tools/deps/sibling-pins.env ($val)"
                  grep -En "^  ${key}: " "$f" || true
                  fail=1
                fi
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "::error::$key from tools/deps/sibling-pins.env appears in no workflow env block"
              fail=1
            fi
          done < tools/deps/sibling-pins.env
          if [ "$keys" -eq 0 ]; then
            echo "::error::tools/deps/sibling-pins.env defines no pins"
            fail=1
          fi
          exit "$fail"

      # SHELLCHECK_SHA256 is the release asset's `digest` for
      # shellcheck-v0.11.0.linux.x86_64.tar.gz from
      # https://github.com/koalaman/shellcheck/releases/tag/v0.11.0,
      # re-hashed locally on 2026-10-29. .tar.gz, not .tar.xz: no xz needed.
      - name: Install shellcheck (pinned by path and sha256)
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION"
          asset="shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.gz"
          rm -rf "$dir" && mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$asset" \
            "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/$asset"
          echo "$SHELLCHECK_SHA256  $dir/$asset" | sha256sum -c -
          tar xzf "$dir/$asset" -C "$dir" --strip-components=1 "shellcheck-v$SHELLCHECK_VERSION/shellcheck"
          got=$("$dir/shellcheck" --version | sed -n 's/^version: //p')
          if [ "$got" != "$SHELLCHECK_VERSION" ]; then
            echo "::error::pinned shellcheck reports '$got', expected '$SHELLCHECK_VERSION'"
            exit 1
          fi
          echo "SHELLCHECK=$dir/shellcheck" >> "$GITHUB_ENV"

      # Severity warning and up. Info-level findings (SC2086 and friends) are
      # not gated.
      - name: shellcheck tracked shell scripts
        run: |
          set -euo pipefail
          git ls-files -z '*.sh' '*.bash' | xargs -0 -r "$SHELLCHECK" -S warning

      - id: py39
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"

      # Under 3.9 the compile step is the real 3.9 parser; the AST pass catches
      # what parses on 3.9 but fails when it runs (unguarded tomllib, `X | None`
      # annotations without `from __future__ import annotations`, ...). The
      # self-test first: a checker only ever seen to pass could not fail.
      - name: Python 3.9 floor
        env:
          PY39: ${{ steps.py39.outputs.python-path }}
        run: |
          set -euo pipefail
          "$PY39" -c 'import sys; assert sys.version_info[:2] == (3, 9), sys.version'
          "$PY39" tools/check-py-floor.py --self-test
          git ls-files -z '*.py' | xargs -0 -r "$PY39" tools/check-py-floor.py

      # SWV-REL-001: the evidence-bundle packager + verifier, exercised with
      # one green and four red fixture controls (tamper, gap rows, missing
      # verifier, rejected signature). The real producer tools run in the
      # release workflow; this gates the machinery on every PR.
      - name: Evidence-bundle machinery (SWV-REL-001)
        run: tools/test-evidence-bundle.sh
