name: Release

# Release variant: serialize per-tag, never cancel. A cancelled release
# mid-publish leaves the GitHub Release page, build attestations, and
# per-target binary archives in an inconsistent state — better to queue
# than abort. Mirrors the pulseengine/synth and pulseengine/rivet
# release workflows.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  # Manual re-run for a tag whose initial run failed partway. The tag
  # must already exist; this does not create tags.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # wohl-hub depends on the relay sibling via path = "../relay/...".
  # Pin the relay commit explicitly so release builds are reproducible
  # against a known sibling state. Keep this SHA in lock-step with
  # ci.yml's RELAY_REF — bump them together via PR. fetch-depth: 0
  # on the checkout below covers force-pushes of relay (sibling repo
  # is routinely rebased; see ci.yml comment + issue #8).
  RELAY_REF: 178ffd479ad863c91ece4f580379a9207c36a530
  # Pinned rules_wasm_component for the Bazel wasm build (build-wasm job),
  # in lock-step with ci.yml's RULES_WASM_COMPONENT_REF — bump together.
  RULES_WASM_COMPONENT_REF: fbe20571eee9bd05687c95e7a43f6c236d9b2428
  # Evidence-bundle producer pins (SWREQ-REL-001). RIVET_REF in lock-step
  # with ci.yml, WITNESS_REF with witness-gate.yml — bump together.
  RIVET_REF: 78f001e23d595ba816f7a7be59282194dedfdc12
  WITNESS_REF: v0.38.0
  # sigil ships its binary as `wsc`. Installed from the sigil release
  # (cosign-verified against the tag identity) instead of built from git, so
  # the bundle is signed by the same binary an assessor installs
  # (`cargo install wsc-cli`, or the release asset). One pin, bumped via PR,
  # in lock-step with ci.yml's WSC_VERSION. sigil main carries post-v0.12.0
  # security fixes — bump when v0.12.1 is cut.
  WSC_VERSION: v0.12.0

jobs:
  # ── Cross-platform binary builds ──────────────────────────────────────
  # wohl-hub builds the home-supervision orchestrator: it wires the six
  # verified Wohl monitors and the Relay engines into a single binary
  # that runs on the hub host (Pi / MiniPC / dev Mac).
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          # Native arm64 runner — avoids cross-compilation's friction
          # with wohl's `path = "../relay/..."` sibling-path deps
          # (cross's docker image doesn't mount the parent dir, and
          # patching CROSS_CONTAINER_OPTS is more fragile than just
          # using a native runner).
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          # macOS targets for dev convenience — wohl-hub on a Mac is
          # not the production deployment shape, but reviewers and
          # developers want a runnable binary.
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: wohl
          ref: ${{ inputs.tag || github.ref }}

      # relay sibling checkout: wohl's Cargo.toml has path-deps like
      # `relay-lc = { path = "../relay/crates/relay-lc" }`. The build
      # needs relay co-located at the workspace's parent dir.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pulseengine/relay
          path: relay
          ref: ${{ env.RELAY_REF }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: wohl
          key: release-${{ matrix.target }}

      - name: Build wohl-hub
        working-directory: wohl
        run: cargo build --release --target ${{ matrix.target }} -p wohl-hub

      - name: Strip binary
        # Strip on the native targets; skip on cross or unusual setups.
        if: runner.os == 'Linux' || runner.os == 'macOS'
        working-directory: wohl
        run: strip "target/${{ matrix.target }}/release/wohl-hub" 2>/dev/null || true

      - name: Package archive
        env:
          TARGET: ${{ matrix.target }}
          # Resolve the version once: tag push -> refs/tags/vX.Y.Z;
          # workflow_dispatch -> the user-supplied tag input. Bound via
          # env: and dereferenced as $VERSION below — never expand
          # ${{ ... }} directly inside run: (command-injection vector).
          INPUT_TAG: ${{ inputs.tag }}
        working-directory: wohl
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          ARCHIVE="wohl-hub-${VERSION}-${TARGET}.tar.gz"
          mkdir -p staging
          cp "target/${TARGET}/release/wohl-hub" staging/
          cp README.md LICENSE staging/ 2>/dev/null || true
          tar -czf "$ARCHIVE" -C staging .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: wohl/${{ env.ARCHIVE }}
          retention-days: 7

  # ── Build the verified Matter core wasm as a release artifact ─────────
  # The composed component //:wohl-matter-composed is built + signed in CI
  # (bazel-build + sigil-attest) but never shipped — it "died at the release
  # boundary" (issue #50, Track C). Rebuild it here so create-release can put
  # it through the same supply chain as the binaries (SHA256SUMS + cosign +
  # SLSA). Mirrors ci.yml's bazel-build job.
  build-wasm:
    name: Build composed Matter wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: wohl
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pulseengine/relay
          path: relay
          ref: ${{ env.RELAY_REF }}
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pulseengine/rules_wasm_component
          path: rules_wasm_component
          ref: ${{ env.RULES_WASM_COMPONENT_REF }}
          fetch-depth: 0
      # rules_rocq_rust's module extension needs nix-build on PATH at Bazel
      # analysis time (same pin as ci.yml's bazel jobs).
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-build-wasm
          repository-cache: true
      - name: bazel build //:wohl-matter-composed
        working-directory: wohl
        env:
          CARGO_BAZEL_REPIN: "1"
        run: |
          set -euo pipefail
          bazel build //:wohl-matter-composed
          WASM=$(find "$(bazel info bazel-bin)" -name 'wohl-matter-composed.wasm' | head -1)
          test -n "$WASM"
          # bazel-bin is a symlink tree; copy out a real file for upload.
          cp -L "$WASM" "$GITHUB_WORKSPACE/wohl-matter-composed.wasm"
          ls -la "$GITHUB_WORKSPACE/wohl-matter-composed.wasm"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-composed
          path: wohl-matter-composed.wasm
          retention-days: 7

  # ── Assemble the evidence bundle (SWREQ-REL-001 / SYSV-REL-001) ────────
  # Produces wohl-vX.Y.Z-evidence-bundle.tar.gz: rivet trace export +
  # coverage, the witness MC/DC report for the Matter seam, and the signed
  # composed component with its public key. The bundle's own verify.sh runs
  # here as a gate before anything is uploaded. The signing key is ephemeral
  # (generated in this job, never stored); what binds the bundle to this
  # workflow's identity is the outer SHA256SUMS + cosign + SLSA chain it
  # flows through like every other asset.
  evidence-bundle:
    name: Assemble evidence bundle
    runs-on: ubuntu-latest
    needs: build-wasm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: wohl
          ref: ${{ inputs.tag || github.ref }}
      # relay sibling: wohl's rivet.yaml declares relay as a path external
      # (../relay), resolved live by rivet export/coverage.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pulseengine/relay
          path: relay
          ref: ${{ env.RELAY_REF }}
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pulseengine/rivet
          path: rivet
          ref: ${{ env.RIVET_REF }}
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pulseengine/witness
          path: witness
          ref: ${{ env.WITNESS_REF }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            rivet
            witness
          key: evidence-bundle
      - name: Build producer tools (rivet-cli, witness)
        # cargo build (not cargo install) for both: install builds in a
        # private temp target dir that Swatinem/rust-cache cannot cache.
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path rivet/rivet-cli/Cargo.toml --bin rivet
          cargo build --release -p witness-mcdc --bin witness --manifest-path witness/Cargo.toml
      - name: Install wsc from the sigil release (cosign-verified)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wsc" && cd "$RUNNER_TEMP/wsc"
          gh release download "$WSC_VERSION" --repo pulseengine/sigil \
            -p wsc-linux-x86_64 -p SHA256SUMS.txt -p SHA256SUMS.txt.cosign.bundle
          cosign verify-blob \
            --bundle SHA256SUMS.txt.cosign.bundle \
            --certificate-identity "https://github.com/pulseengine/sigil/.github/workflows/release.yml@refs/tags/$WSC_VERSION" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            SHA256SUMS.txt
          grep 'wsc-linux-x86_64$' SHA256SUMS.txt | sha256sum -c -
          chmod +x wsc-linux-x86_64
          ./wsc-linux-x86_64 --version
      - name: Download composed Matter wasm
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wasm-composed
          path: wasm
      - name: Produce evidence and assemble the bundle
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          EV="$RUNNER_TEMP/evidence"; mkdir -p "$EV"
          RIVET="$GITHUB_WORKSPACE/rivet/target/release/rivet"

          # rivet trace evidence
          (cd wohl && "$RIVET" coverage --format json > "$EV/coverage.json")
          (cd wohl && "$RIVET" export -f generic-yaml -o "$EV/trace-export.yaml")

          # witness MC/DC report (same gate script CI runs on every PR)
          WITNESS="$GITHUB_WORKSPACE/witness/target/release/witness" \
            wohl/crates/wohl-matter-core/witness/run-witness.sh | tee "$EV/mcdc-report.txt"

          # attestation: ephemeral keypair, sign the composed component
          SIGIL="$RUNNER_TEMP/wsc/wsc-linux-x86_64"
          "$SIGIL" keygen -k "$RUNNER_TEMP/sk.key" -K "$EV/signing.pub"
          "$SIGIL" sign -i wasm/wohl-matter-composed.wasm \
                        -o "$EV/wohl-matter-composed.signed.wasm" \
                        -k "$RUNNER_TEMP/sk.key"
          rm -f "$RUNNER_TEMP/sk.key"

          # tooling record: the exact producing refs and versions. The wohl
          # commit is the CHECKED-OUT one — on a workflow_dispatch re-run
          # GITHUB_SHA is the dispatching branch's head, not the tag.
          WOHL_SHA="$(git -C wohl rev-parse HEAD)"
          {
            echo "wohl: $VERSION ($WOHL_SHA)"
            echo "rivet: $RIVET_REF ($("$RIVET" --version))"
            echo "sigil (wsc): $WSC_VERSION"
            echo "witness: $WITNESS_REF"
            echo "relay sibling: $RELAY_REF"
            echo "workflow: $GITHUB_WORKFLOW_REF"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$EV/TOOLING.txt"

          wohl/tools/evidence-bundle.sh \
            --version "$VERSION" \
            --coverage "$EV/coverage.json" \
            --trace-export "$EV/trace-export.yaml" \
            --witness-report "$EV/mcdc-report.txt" \
            --signed-wasm "$EV/wohl-matter-composed.signed.wasm" \
            --pubkey "$EV/signing.pub" \
            --tooling "$EV/TOOLING.txt" \
            --out "$RUNNER_TEMP/bundle-out"

          # Gate: the bundle must pass its own one-command verifier, with
          # the real sigil binary, before it may ship.
          mkdir -p "$RUNNER_TEMP/verify"
          tar -xzf "$RUNNER_TEMP/bundle-out/wohl-${VERSION}-evidence-bundle.tar.gz" \
              -C "$RUNNER_TEMP/verify"
          SIGIL="$SIGIL" "$RUNNER_TEMP/verify/wohl-${VERSION}-evidence/verify.sh"

          cp "$RUNNER_TEMP/bundle-out/wohl-${VERSION}-evidence-bundle.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-bundle
          path: wohl-*-evidence-bundle.tar.gz
          retention-days: 7

  # ── Create the GitHub Release: checksums, provenance, signing ─────────
  create-release:
    name: Create GitHub Release
    needs: [build-binaries, build-wasm, evidence-bundle]
    runs-on: ubuntu-latest
    permissions:
      # Keyless signing + provenance need an OIDC token; release-asset
      # upload needs contents: write; build provenance attestation
      # needs attestations: write. This block mirrors the permissions
      # set used by the pulseengine/synth and pulseengine/sigil
      # release workflows.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: wohl
          ref: ${{ inputs.tag || github.ref }}

      # relay sibling needed because cargo-cyclonedx walks workspace
      # path-deps when generating the SBOM.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pulseengine/relay
          path: relay
          ref: ${{ env.RELAY_REF }}
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Flatten release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          # The composed Matter wasm (from build-wasm) ships too — it flows
          # through the same SHA256SUMS + cosign + SLSA chain as the binaries.
          find artifacts -type f -name "*.wasm" -exec cp {} release-assets/ \;
          ls -la release-assets/

      # CycloneDX SBOM for wohl-hub. Generated *before* SHA256SUMS so
      # its digest is captured in the checksum manifest; the cosign
      # signature over SHA256SUMS.txt transitively covers the SBOM.
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      - name: Generate wohl-hub SBOM (CycloneDX)
        env:
          INPUT_TAG: ${{ inputs.tag }}
        working-directory: wohl
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          BARE="${VERSION#v}"
          # cargo-cyclonedx doesn't proxy cargo's `-p` flag — use
          # --manifest-path to target wohl-hub's Cargo.toml directly.
          cargo cyclonedx \
            --manifest-path crates/wohl-hub/Cargo.toml \
            --format json \
            --spec-version 1.5
          SBOM_SRC="crates/wohl-hub/wohl-hub.cdx.json"
          if [ ! -f "$SBOM_SRC" ]; then
            SBOM_SRC=$(find crates/wohl-hub -maxdepth 2 -name '*.cdx.json' | head -1)
          fi
          test -n "$SBOM_SRC" && test -f "$SBOM_SRC"
          cp "$SBOM_SRC" "../release-assets/wohl-hub-${BARE}.cdx.json"
          echo "::notice::wohl-hub SBOM written to release-assets/wohl-hub-${BARE}.cdx.json"
          ls -la ../release-assets/

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ── SLSA build provenance (GitHub-native) ──────────────────────────
      # actions/attest-build-provenance generates an in-toto SLSA v1
      # provenance statement for every binary archive, signs it keyless
      # via Sigstore (Fulcio cert bound to this workflow's OIDC identity),
      # and records it in the Rekor transparency log. Consumers verify
      # with `gh attestation verify <file> --repo pulseengine/wohl`.
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.wasm

      # ── Sigstore keyless signing (cosign) ──────────────────────────────
      # Signs SHA256SUMS.txt so a consumer can verify the checksum file
      # itself was produced by this workflow (closes the gap where an
      # attacker who can replace a release asset could also replace the
      # plain checksum file). Mirrors the pulseengine/synth and
      # pulseengine/rivet cosign sign-blob pattern.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign SHA256SUMS with cosign (keyless OIDC)
        run: |
          set -euo pipefail
          cd release-assets
          cosign sign-blob \
            --yes \
            --bundle SHA256SUMS.txt.cosign.bundle \
            --output-signature SHA256SUMS.txt.sig \
            --output-certificate SHA256SUMS.txt.pem \
            SHA256SUMS.txt
          echo "::notice::SHA256SUMS signed via Sigstore keyless flow."
          ls -la ./*

      - name: Capture build environment
        run: |
          set -euo pipefail
          {
            echo "rustc: $(rustc --version)"
            echo "cargo: $(cargo --version)"
            echo "cosign: $(cosign version 2>&1 | head -1)"
            echo "runner: $(uname -srm)"
          } > release-assets/build-env.txt
          cat release-assets/build-env.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The wohl checkout is at `wohl/` (not the workspace root, so
          # we can co-locate the relay sibling at `../relay`). That means
          # the workspace root has no `.git`, and `gh release ...` can't
          # infer the repo via the normal git remote lookup. GH_REPO
          # makes it explicit. Without this the step fails with
          # `fatal: not a git repository`.
          GH_REPO: ${{ github.repository }}
          # Untrusted-input safety: the tag name flows in via env: and is
          # dereferenced through $VERSION, never expanded into the shell.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          # Verification one-liner for release notes — copy-paste-friendly:
          #
          #   cosign verify-blob \
          #     --certificate-identity-regexp \
          #       'https://github.com/pulseengine/wohl/.github/workflows/release.yml@.*' \
          #     --certificate-oidc-issuer \
          #       'https://token.actions.githubusercontent.com' \
          #     --bundle SHA256SUMS.txt.cosign.bundle \
          #     SHA256SUMS.txt
          #   gh attestation verify wohl-hub-vX.Y.Z-<triple>.tar.gz \
          #     --repo pulseengine/wohl
          #
          # Idempotent: re-running the workflow for an existing release
          # uploads/overwrites assets rather than failing. --clobber lets
          # a re-run replace assets a previous partial run left behind.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::Release $VERSION exists; uploading assets"
            gh release upload "$VERSION" --clobber release-assets/*
          else
            echo "::notice::Creating Release $VERSION with assets"
            gh release create "$VERSION" \
              --title "wohl $VERSION" \
              --generate-notes \
              release-assets/*
          fi

  # ── Compliance report (wohl#64) ───────────────────────────────────────
  # `on: release` never fires for the bot-published releases this workflow
  # creates (GITHUB_TOKEN-raised events start no workflows), so the report
  # lane went silent after v0.3.0. Calling it here closes that: same run,
  # fires for every release. It runs after create-release, so a compliance
  # failure cannot take the release down — the assets are already up; it
  # reddens this run instead of failing silently.
  compliance:
    name: Compliance report
    needs: create-release
    permissions:
      contents: write
    uses: ./.github/workflows/compliance.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
