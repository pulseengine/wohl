version: 2
# One PR per logical release across all directories: version-locked families
# (wasm-tools, wasmtime) and all github-actions pins in / must not split into
# one PR per directory. (Learned from loom/witness/mcp/relay/rules_wasm_component,
# where one release arrived as 4-8 PRs.)
groups:
  wasm-tools-family:
    patterns:
      - "wasmparser"
      - "wasm-encoder"
      - "wasmprinter"
      - "wit-component"
      - "wit-parser"
      - "wasm-metadata"
      - "wat"
      - "walrus"
  wasmtime:
    patterns:
      - "wasmtime"
      - "wasmtime-*"
  github-actions-all:
    package-ecosystem: github-actions
    patterns:
      - "*"
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    labels:
      - dependencies
  - package-ecosystem: cargo
    directory: /crates/wohl-air
    schedule:
      interval: weekly
    labels:
      - dependencies
  - package-ecosystem: cargo
    directory: /crates/wohl-alert
    schedule:
      interval: weekly
    labels:
      - dependencies
  - package-ecosystem: cargo
    directory: /crates/wohl-door
    schedule:
      interval: weekly
    labels:
      - dependencies
