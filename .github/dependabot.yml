version: 2
# Grouped monthly updates (fleet template from pulseengine/rivet, owner
# decision 2026-11-21). One entry per ecosystem, its directories in one
# `directories:` list, so a release opens one PR and not one per directory.
# Every entry runs monthly (the 1st, 02:00 UTC), keeps at most 2 PRs open,
# and waits 7 days after a release (cooldown). Lockstep groups come first
# because Dependabot puts a dependency in the FIRST group it matches; then
# one minor-patch group. Majors stay ungrouped, one PR each, so a breaking
# change is read on its own. Security updates ignore the schedule and limit.
#
# The cargo list is the standalone roots (each has its own Cargo.lock); the
# root workspace covers every crates/* member. tools/lockfile-controls/* are
# deliberately-broken negative-control fixtures (stale lock, known advisory)
# and must never be updated — they are not listed.
#
# A bump to crates/wohl-leak/wasm or the spike2c locks invalidates
# MODULE.bazel.lock (recorded crate_universe extension input); the Bazel job
# runs --lockfile_mode=error on every PR, so such a branch goes red until
# the lock is recaptured. That red is the verify-only lock check working.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      github-actions-all:
        patterns:
          - "*"
  # / (the workspace) and /fuzz are NOT listed: both depend on ../relay by
  # path (siblings checkout), which Dependabot's clone cannot reach, and its
  # cargo updater fails the WHOLE grouped update on path_dependencies_not_
  # reachable (run 45692453614, 2026-11-25). Workspace registry bumps come
  # through the RUSTSEC sweeps and deliberate cargo-update rounds instead;
  # cargo-deny in CI stays the advisory watch for them.
  - package-ecosystem: cargo
    directories:
      - /crates/wohl-leak/wasm
      - /crates/wohl-matter-core/spike2-exec
      - /crates/wohl-matter-core/spike2c-compose/mcore
      - /crates/wohl-matter-core/spike2c-compose/transport
      - /crates/wohl-matter-core/witness
    schedule:
      interval: monthly
      time: "02:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      wasm-tools-family:
        patterns:
          - "wasmparser"
          - "wasm-encoder"
          - "wasmprinter"
          - "wit-component"
          - "wit-parser"
          - "wasm-metadata"
          - "wat"
          - "walrus"
      wasmtime:
        patterns:
          - "wasmtime"
          - "wasmtime-*"
      # rs-matter is pinned by git rev in the manifests, outside Dependabot's
      # reach — its bumps stay deliberate, hand-made rev moves.
      minor-patch:
        update-types:
          - minor
          - patch
